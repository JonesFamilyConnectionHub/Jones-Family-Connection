<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#202124">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Jones Family Connections</title>
<style>
:root{--ink:#202124;--muted:#6b7280;--bg:#f7f7f5;--card:#fff;--line:#d7d7d2;--accent:#315f8c}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:760px;margin:auto;padding:22px 14px 40px}
.top{text-align:center}.brand{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-size:32px;margin:5px 0}.sub{color:var(--muted);margin:0 0 18px}
.puzzle-title{text-align:center;font-weight:800;margin:-5px 0 15px}
.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-weight:800}
.tabs button.active{background:var(--ink);color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.instructions{text-align:center;color:#555;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.word{width:100%;height:70px;border:0;border-radius:10px;background:#eeeDE8;font-weight:800;font-size:clamp(10px,3.1vw,15px);line-height:1.08;padding:5px 3px;cursor:pointer;overflow-wrap:anywhere;word-break:normal}
.word.sel{background:#333;color:#fff;transform:translateY(-2px)}
.controls{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
.controls button,.primary{border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px 13px;font-weight:800;cursor:pointer}
.controls button.primary{background:var(--ink);color:#fff;border-color:var(--ink);flex:1;min-height:48px}
.controls button.primary:disabled{background:#e3e3e0;color:#555;border-color:#c8c8c4;opacity:1;cursor:default}
.controls button.share{width:100%;background:#315f8c;color:#fff;border-color:#315f8c;flex:1;font-size:16px;min-height:52px}
.status{text-align:center;margin:13px 0;font-weight:700;min-height:22px}
.solved{display:grid;gap:8px;margin-bottom:10px}.group{border-radius:12px;padding:12px;text-align:center}.group b{display:block}
.yellow{background:#f5df8a}.green{background:#a9d8a3}.blue{background:#9dc8ed}.purple{background:#c7a9df}
.hidden{display:none}.field{margin:9px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px}
.small{font-size:12px;color:var(--muted)}.puzzle-card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;background:#fafaf8}
.share-note{text-align:center;color:var(--muted);font-size:12px;margin:8px 0 0}
@media(max-width:360px){.wrap{padding-left:9px;padding-right:9px}.grid{gap:5px}.word{height:66px;font-size:10px;padding-left:2px;padding-right:2px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="brand">Jones Family</div><h1>Connections</h1><p class="sub">Find four groups of four.</p></div>
<div id="puzzleTitle" class="puzzle-title"></div>
<div class="tabs"><button id="playTab" class="active">Play</button><button id="createTab">Create Puzzle</button></div>

<section id="play"><div class="panel">
<p class="instructions">Select <b>four words</b> that belong together, then submit.</p>
<div id="solved" class="solved"></div><div id="grid" class="grid"></div>
<div class="controls"><button id="shuffle">Shuffle</button><button id="hint">Hint</button><button id="submit" class="primary" disabled>ENTER</button></div>
<div class="controls"><button id="share" class="primary share">📤 SHARE THIS PUZZLE</button></div>
<div id="status" class="status" aria-live="polite"></div>
<p class="share-note">Share your puzzle so family members can play the exact same puzzle.</p>
</div></section>

<section id="create" class="hidden"><div class="panel">
<h2>Create a Puzzle</h2><p class="small">Enter four category names and four words for each. The 16 words must be unique.</p>
<form id="createForm">
<div class="field"><label>Puzzle name</label><input id="pname" placeholder="Jones Family Christmas"></div>
<div id="form"></div>
<button class="primary" type="submit">Create &amp; Play</button>
<p id="formMsg" class="small" aria-live="polite"></p>
</form></div></section>
</div>
<script>
const colors=["yellow","green","blue","purple"];
const defaultPuzzle={title:"Family Warm-Up",groups:[
{name:"Workshop Tools",words:["CLAMP","CHISEL","MALLET","PLANE"]},
{name:"Breakfast Foods",words:["BACON","WAFFLE","TOAST","OATMEAL"]},
{name:"Movie Genres",words:["HORROR","COMEDY","WESTERN","THRILLER"]},
{name:"Things That Can Be Green",words:["APPLE","PEPPER","FROG","LIGHT"]}]};

let puzzle=defaultPuzzle,remaining=[],selected=[],solved=[],mistakes=0;

function encodePuzzle(p){
  const bytes=new TextEncoder().encode(JSON.stringify(p));
  let binary="";
  bytes.forEach(b=>binary+=String.fromCharCode(b));
  return btoa(binary).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function decodePuzzle(s){
  try{
    s=s.replace(/-/g,"+").replace(/_/g,"/");
    while(s.length%4)s+="=";
    const binary=atob(s);
    const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){return null}
}
function puzzleFromUrl(){
  const h=location.hash;
  return h.startsWith("#p=")?decodePuzzle(h.slice(3)):null;
}
function setPuzzleUrl(p){
  history.replaceState(null,"",location.pathname+location.search+"#p="+encodePuzzle(p));
}
const $=id=>document.getElementById(id);
function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function start(p){
  puzzle=p;
  remaining=shuffle(p.groups.flatMap(g=>g.words));
  selected=[];solved=[];mistakes=0;
  $("puzzleTitle").textContent=p.title||"";
  render();
}
async function sharePuzzle(){
  setPuzzleUrl(puzzle);
  const url=location.href;
  const text=`Play my Jones Family Connections puzzle: ${puzzle.title}`;
  if(navigator.share){
    try{
      await navigator.share({title:"Jones Family Connections",text,url});
      $("status").textContent="Puzzle shared!";
    }catch(e){
      if(e.name!=="AbortError") $("status").textContent="Sharing was cancelled.";
    }
  }else if(navigator.clipboard){
    try{
      await navigator.clipboard.writeText(url);
      $("status").textContent="Puzzle link copied! Paste it into a text message.";
    }catch(e){$("status").textContent=url;}
  }else{
    $("status").textContent=url;
  }
}
function render(){
  $("grid").innerHTML=remaining.map(w=>`<button type="button" class="word ${selected.includes(w)?"sel":""}" data-word="${w}">${w}</button>`).join("");
  document.querySelectorAll("#grid .word").forEach(b=>b.addEventListener("click",()=>toggle(b.dataset.word)));
  $("solved").innerHTML=solved.map((g,i)=>`<div class="group ${colors[i]}"><b>${g.name}</b>${g.words.join(" • ")}</div>`).join("");
  $("submit").disabled=selected.length!==4;
  $("status").textContent=solved.length===4?"🎉 You solved it!":`Selected ${selected.length}/4 • Mistakes: ${mistakes}/4`;
}
function toggle(w){
  selected=selected.includes(w)?selected.filter(x=>x!==w):(selected.length<4?[...selected,w]:selected);
  render();
}
$("submit").onclick=()=>{
  if(selected.length!==4)return;
  const g=puzzle.groups.find(x=>x.words.every(w=>selected.includes(w))&&selected.every(w=>x.words.includes(w)));
  if(g){solved.push(g);remaining=remaining.filter(w=>!g.words.includes(w));selected=[]}
  else{mistakes++;selected=[]}
  render();
};
$("shuffle").onclick=()=>{remaining=shuffle(remaining);render()};
$("hint").onclick=()=>{
  const u=puzzle.groups.filter(g=>!solved.includes(g));
  if(u.length){
    const g=u[Math.floor(Math.random()*u.length)];
    $("status").textContent=`Hint: look for a group containing “${g.words[Math.floor(Math.random()*4)]}”.`;
  }
};
$("playTab").onclick=()=>show("play");
$("createTab").onclick=()=>show("create");
$("share").onclick=sharePuzzle;
function show(id){
  $("play").classList.toggle("hidden",id!=="play");
  $("create").classList.toggle("hidden",id!=="create");
  $("playTab").classList.toggle("active",id==="play");
  $("createTab").classList.toggle("active",id==="create");
}
for(let i=1;i<=4;i++)$("form").insertAdjacentHTML("beforeend",`<div class="puzzle-card"><div class="field"><label>Category ${i}</label><input class="cat" placeholder="Category name"></div><div class="field"><label>Four words (comma separated)</label><input class="words" placeholder="word one, word two, word three, word four"></div></div>`);
$("createForm").onsubmit=e=>{
  e.preventDefault();
  let cats=[...document.querySelectorAll(".cat")],ws=[...document.querySelectorAll(".words")],groups=[];
  for(let i=0;i<4;i++){
    let name=cats[i].value.trim(),words=ws[i].value.split(",").map(x=>x.trim().toUpperCase()).filter(Boolean);
    if(!name||words.length!==4){$("formMsg").textContent=`Category ${i+1} needs a name and exactly four words.`;return}
    groups.push({name,words});
  }
  let all=groups.flatMap(g=>g.words);
  if(new Set(all).size!==16){$("formMsg").textContent="All 16 words must be different.";return}
  const p={title:$("pname").value.trim()||"Jones Family Connections",groups};
  setPuzzleUrl(p);
  start(p);
  show("play");
};
const incoming=puzzleFromUrl();
start(incoming||defaultPuzzle);
</script>
</body>
</html>
